<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CliniCare | Historia Clínica & Seguimiento</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @media print {
      body * { visibility: hidden; }
      #print-area, #print-area * { visibility: visible; }
      #print-area { 
        position: absolute; 
        left: 0; 
        top: 0; 
        width: 100%; 
        padding: 0;
        margin: 0;
      }
      .no-print { display: none !important; }
      .print-only { display: block !important; }
    }
    .print-only { display: none; }
  </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Función auxiliar para parsear fechas formateadas como DD/MM/YYYY o YYYY-MM-DD
    const parseFecha = (strFecha) => {
      if (!strFecha) return null;
      if (strFecha.includes('/')) {
        const partes = strFecha.split('/');
        return new Date(partes[2], partes[1] - 1, partes[0]);
      }
      return new Date(strFecha);
    };

    // Función auxiliar para sumar meses exactos manteniendo el mismo día
    const sumarMesesMismaFecha = (fechaBase, meses) => {
      const d = new Date(fechaBase);
      const diaDeseado = d.getDate();
      d.setMonth(d.getMonth() + meses);
      
      if (d.getDate() !== diaDeseado) {
        d.setDate(0);
      }
      return d.toLocaleDateString();
    };

    // Evaluador Clínico Exacto Corregido
    const evaluarNivelClinico = (tipo, valorObj, condicion) => {
      if (tipo === 'Control de Glucosa') {
        const num = parseFloat(valorObj.glucosa);
        if (isNaN(num)) return { estado: 'normal', mensaje: 'Valor no válido' };
        
        if (condicion === 'En Ayunas') {
          if (num < 70) return { estado: 'critico', mensaje: '⚠️ Hipoglucemia (<70 mg/dL)' };
          if (num >= 70 && num <= 99) return { estado: 'normal', mensaje: '✓ Glucosa Normal (70-99 mg/dL)' };
          if (num >= 100 && num <= 125) return { estado: 'alerta', mensaje: '⚡ Prediabetes (100-125 mg/dL)' };
          if (num >= 126) return { estado: 'critico', mensaje: '⚠️ Diabetes (≥126 mg/dL)' };
        } else if (condicion === 'Postprandial (2h después de comer)') {
          if (num < 70) return { estado: 'critico', mensaje: '⚠️ Hipoglucemia (<70 mg/dL)' };
          if (num < 140) return { estado: 'normal', mensaje: '✓ Glucosa Normal Postprandial (<140 mg/dL)' };
          if (num >= 140 && num <= 199) return { estado: 'alerta', mensaje: '⚡ Tolerancia Alterada (140-199 mg/dL)' };
          if (num >= 200) return { estado: 'critico', mensaje: '⚠️ Glucosa Muy Alta (≥200 mg/dL)' };
        } else {
          if (num < 70) return { estado: 'critico', mensaje: '⚠️ Hipoglucemia (<70 mg/dL)' };
          if (num >= 200) return { estado: 'critico', mensaje: '⚠️ Elevación Crítica (≥200 mg/dL)' };
          if (num >= 140) return { estado: 'alerta', mensaje: '⚡ Glucosa Elevada (≥140 mg/dL)' };
          return { estado: 'normal', mensaje: '✓ Glucosa Estable' };
        }
      }

      if (tipo === 'Presión Arterial') {
        const sis = parseFloat(valorObj.sistolica);
        const dia = parseFloat(valorObj.diastolica);

        if (isNaN(sis) || isNaN(dia)) return { estado: 'normal', mensaje: 'Ingrese ambos valores' };

        if (sis >= 180 || dia >= 120) {
          if (sis >= 180 && dia < 90) {
            return { estado: 'critico', mensaje: '🚨 Hipertensión Sistólica Aislada Severa (Sístole ≥180 mmHg)' };
          }
          return { estado: 'critico', mensaje: '🚨 Crisis Hipertensiva (≥180 o ≥120 mmHg)' };
        }

        if (sis >= 140 || dia >= 90) {
          if (sis >= 140 && dia < 80) {
            return { estado: 'critico', mensaje: '⚠️ Hipertensión Sistólica Aislada (Nivel 2: Sístole ≥140 mmHg)' };
          }
          return { estado: 'critico', mensaje: '⚠️ Hipertensión Nivel 2 (≥140 o ≥90 mmHg)' };
        }

        if (sis < 90 || dia < 60) return { estado: 'critico', mensaje: '⚠️ Hipotensión (<90 o <60 mmHg)' };

        if (sis <= 120 && dia <= 80) return { estado: 'normal', mensaje: '✓ Presión Arterial Normal (≤120 y ≤80 mmHg)' };

        if ((sis >= 130 && sis <= 139) || (dia > 80 && dia <= 89)) {
          return { estado: 'alerta', mensaje: '⚡ Hipertensión Nivel 1 (130-139 / 81-89 mmHg)' };
        }
        if (sis > 120 && sis < 130 && dia <= 80) {
          return { estado: 'alerta', mensaje: '⚡ Presión Elevada (121-129 y ≤80 mmHg)' };
        }

        return { estado: 'normal', mensaje: '✓ Presión Arterial Normal' };
      }

      return { estado: 'normal', mensaje: 'Valor Estable' };
    };

    function App() {
      const [vistaActual, setVistaActual] = useState('seguimiento');

      const [pacientes, setPacientes] = useState(() => {
        const guardados = localStorage.getItem('clinicare_pacientes_v8');
        return guardados ? JSON.parse(guardados) : [
          {
            id: '1',
            nombre: 'María Perez',
            dni: '72257066',
            genero: 'Femenino',
            fechaNacimiento: '2000-06-30',
            telefono: '987654321',
            contactoEmergencia: 'Carlos Pérez - 912345678',
            tipoSangre: 'O+',
            embarazada: 'No',
            enfermedadesBase: ['Diabetes'],
            otrasAfecciones: 'Gastritis Crónica',
            alergias: 'Penicilina',
            severidadAlergia: 'Severa (Anafilaxia / Riesgo de Vida)',
            inyeccionesAnticonceptivas: [
              {
                id: 'iny_1',
                fechaAplicacion: new Date().toLocaleDateString(),
                medicamento: 'Cyclofem',
                tipo: 'Mensual',
                proximaFecha: sumarMesesMismaFecha(new Date(), 1),
                observacion: 'Aplicación en glúteo derecho sin complicaciones'
              }
            ],
            seguimientos: []
          }
        ];
      });

      const [filtroEstado, setFiltroEstado] = useState('todos');
      const [filtroGeneroAnticonceptivo, setFiltroGeneroAnticonceptivo] = useState('Femenino');
      const [busqueda, setBusqueda] = useState('');
      const [pacienteSeleccionado, setPacienteSeleccionado] = useState(null);
      const [pacienteAnticonceptivoSel, setPacienteAnticonceptivoSel] = useState(null);
      
      const [seguimientoImprimir, setSeguimientoImprimir] = useState(null);
      const [impresionAnticonceptivos, setImpresionAnticonceptivos] = useState(false);

      const [editandoPacienteId, setEditandoPacienteId] = useState(null);

      const [formRegistro, setFormRegistro] = useState({
        nombre: '',
        dni: '',
        genero: 'Femenino',
        fechaNacimiento: '',
        telefono: '',
        contactoEmergencia: '',
        tipoSangre: 'No especificado',
        embarazada: 'No',
        enfermedadesBase: [],
        otrasAfecciones: '',
        alergias: '',
        severidadAlergia: 'Leve (Urticaria/Picazón)'
      });

      const [nuevaMedicion, setNuevaMedicion] = useState({
        tipo: 'Control de Glucosa',
        glucosa: '',
        sistolica: '',
        diastolica: '',
        condicion: 'En Ayunas',
        observacion: ''
      });

      const [nuevaInyeccion, setNuevaInyeccion] = useState({
        medicamento: '',
        tipo: 'Mensual',
        observacion: ''
      });

      useEffect(() => {
        localStorage.setItem('clinicare_pacientes_v8', JSON.stringify(pacientes));
      }, [pacientes]);

      // EXPORTAR JSON
      const handleExportarDatos = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(pacientes, null, 2));
        const downloadAnchor = document.createElement('a');
        const fechaActual = new Date().toISOString().split('T')[0];
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `Respaldos_BoticaVillazar_${fechaActual}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      // IMPORTAR JSON
      const handleImportarDatos = (e) => {
        const fileReader = new FileReader();
        if (e.target.files && e.target.files[0]) {
          fileReader.readAsText(e.target.files[0], "UTF-8");
          fileReader.onload = (event) => {
            try {
              const datosImportados = JSON.parse(event.target.result);
              if (Array.isArray(datosImportados)) {
                if (confirm("¿Estás seguro de restaurar este respaldo? Reemplazará la base de datos actual.")) {
                  setPacientes(datosImportados);
                  alert("¡Base de datos restaurada con éxito!");
                }
              } else {
                alert("El archivo subido no tiene un formato válido.");
              }
            } catch (error) {
              alert("Error al leer el archivo JSON.");
            }
          };
        }
      };

      // ENVIAR SEGUIMIENTO CLÍNICO A WHATSAPP
      const handleEnviarWhatsAppMediciones = (paciente, seguimiento) => {
        if (!paciente.telefono) return alert("El paciente no tiene número de teléfono.");

        let numLimpio = paciente.telefono.replace(/\D/g, '');
        if (numLimpio.length === 9) numLimpio = '51' + numLimpio;

        let mensaje = `🏥 *BOTICA / VILLAZAR - SEGUIMIENTO CLÍNICO N°${seguimiento.numero}*\n`;
        mensaje += `👤 *Paciente:* ${paciente.nombre}\n`;
        mensaje += `📄 *DNI:* ${paciente.dni}\n`;
        mensaje += `📅 *Fecha:* ${new Date().toLocaleDateString()}\n\n`;
        mensaje += `📋 *RESULTADOS CLÍNICOS:*\n`;

        if (seguimiento.mediciones.length === 0) {
          mensaje += `No hay lecturas en este seguimiento.\n`;
        } else {
          seguimiento.mediciones.forEach((m, idx) => {
            mensaje += `\n${idx + 1}. *${m.tipo}*\n`;
            mensaje += `   • Lectura: ${m.valorTexto}\n`;
            mensaje += `   • Fecha/Hora: ${m.fecha}\n`;
            mensaje += `   • Estado: ${m.evaluacion ? m.evaluacion.mensaje : 'Registrado'}\n`;
          });
        }

        mensaje += `\nGracias por su confianza. ¡Cuidamos de su salud!`;
        window.open(`https://api.whatsapp.com/send?phone=${numLimpio}&text=${encodeURIComponent(mensaje)}`, '_blank');
      };

      // ENVIAR RECORDATORIO DE ANTICONCEPTIVO VÍA WHATSAPP (5 DÍAS O 1 DÍA)
      const handleEnviarWhatsAppRecordatorioAnticonceptivo = (paciente, diasFaltantes) => {
        if (!paciente.telefono) return alert("El paciente no tiene número de teléfono.");

        let numLimpio = paciente.telefono.replace(/\D/g, '');
        if (numLimpio.length === 9) numLimpio = '51' + numLimpio;

        const inyecciones = paciente.inyeccionesAnticonceptivas || [];
        if (inyecciones.length === 0) return alert("El paciente no tiene inyecciones registradas.");

        const ultima = inyecciones[0];
        const tratamientoDesc = ultima.tipo === 'Mensual' ? 'mensual' : 'trimestral';

        let mensaje = `💉 *BOTICA / VILLAZAR - RECORDATORIO DE APLICACIÓN*\n\n`;
        mensaje += `Hola casera/o *${paciente.nombre}*, no se olvide de su aplicación ${tratamientoDesc} (*${ultima.medicamento}*).\n\n`;
        
        mensaje += `📅 *Última aplicación:* ${ultima.fechaAplicacion}\n`;
        mensaje += `📅 *Próxima aplicación:* ${ultima.proximaFecha}\n\n`;

        if (diasFaltantes === 1) {
          mensaje += `⏰ *¡ATENCIÓN!* Le recordamos que *MAÑANA (${ultima.proximaFecha})* le toca la aplicación de su inyección.\n`;
        } else if (diasFaltantes === 5) {
          mensaje += `🗓️ Le recordamos que en *5 DÍAS (${ultima.proximaFecha})* le corresponde la aplicación de su inyección.\n`;
        } else {
          mensaje += `🗓️ Su próxima fecha calculada de aplicación es el *${ultima.proximaFecha}*.\n`;
        }

        mensaje += `\nLe esperamos en la botica para aplicársela a tiempo y mantener la efectividad. ¡Que tenga excelente día!`;
        window.open(`https://api.whatsapp.com/send?phone=${numLimpio}&text=${encodeURIComponent(mensaje)}`, '_blank');
      };

      // ENVIAR AGRADECIMIENTO POR WHATSAPP
      const handleEnviarWhatsAppAgradecimiento = (paciente) => {
        if (!paciente.telefono) return alert("El paciente no tiene número de teléfono.");

        let numLimpio = paciente.telefono.replace(/\D/g, '');
        if (numLimpio.length === 9) numLimpio = '51' + numLimpio;

        const inyecciones = paciente.inyeccionesAnticonceptivas || [];
        if (inyecciones.length === 0) return alert("El paciente no tiene inyecciones registradas.");

        const ultima = inyecciones[0];

        let mensaje = `✨ *BOTICA VILLAZAR*\n\n`;
        mensaje += `Gracias por su preferencia, gracias por confiar en Botica Villazar.\n\n`;
        mensaje += `💉 *Ampolla aplicada:* ${ultima.medicamento} (${ultima.tipo})\n`;
        mensaje += `📅 *Fecha que se aplicó:* ${ultima.fechaAplicacion}\n`;
        mensaje += `📅 *Fecha que le tocaría:* ${ultima.proximaFecha}\n\n`;
        mensaje += `¡Estamos para servirle y cuidar de su salud siempre! 😊`;

        window.open(`https://api.whatsapp.com/send?phone=${numLimpio}&text=${encodeURIComponent(mensaje)}`, '_blank');
      };

      const handleTipoControlChange = (nuevoTipo) => {
        let condicionDefecto = nuevoTipo === 'Control de Glucosa' ? 'En Ayunas' : 'En Reposo';
        setNuevaMedicion({
          ...nuevaMedicion,
          tipo: nuevoTipo,
          condicion: condicionDefecto
        });
      };

      const handleCheckboxEnfermedad = (enfermedad) => {
        setFormRegistro(prev => {
          const existe = prev.enfermedadesBase.includes(enfermedad);
          return {
            ...prev,
            enfermedadesBase: existe
              ? prev.enfermedadesBase.filter(e => e !== enfermedad)
              : [...prev.enfermedadesBase, enfermedad]
          };
        });
      };

      // ABRIR EDICION DIRECTO DESDE LISTA DE PACIENTES
      const handleIniciarEditarPaciente = (paciente) => {
        setPacienteSeleccionado(null);
        setPacienteAnticonceptivoSel(null);

        setFormRegistro({
          nombre: paciente.nombre || '',
          dni: paciente.dni || '',
          genero: paciente.genero || 'Femenino',
          fechaNacimiento: paciente.fechaNacimiento || '',
          telefono: paciente.telefono || '',
          contactoEmergencia: paciente.contactoEmergencia || '',
          tipoSangre: paciente.tipoSangre || 'No especificado',
          embarazada: paciente.embarazada || 'No',
          enfermedadesBase: paciente.enfermedadesBase || [],
          otrasAfecciones: paciente.otrasAfecciones || '',
          alergias: paciente.alergias || '',
          severidadAlergia: paciente.severidadAlergia || 'Leve (Urticaria/Picazón)'
        });

        setEditandoPacienteId(paciente.id);
        setVistaActual('registro');
      };

      const handleRegistrarOActualizarPaciente = (e) => {
        e.preventDefault();
        if (!formRegistro.nombre || !formRegistro.dni) {
          alert("Por favor complete al menos el Nombre y el DNI.");
          return;
        }

        if (editandoPacienteId) {
          const pacientesActualizados = pacientes.map(p => {
            if (p.id === editandoPacienteId) {
              return { ...p, ...formRegistro };
            }
            return p;
          });
          setPacientes(pacientesActualizados);
          alert("Datos del paciente actualizados con éxito.");
        } else {
          const nuevoPaciente = {
            ...formRegistro,
            id: Date.now().toString(),
            inyeccionesAnticonceptivas: [],
            seguimientos: []
          };
          setPacientes([nuevoPaciente, ...pacientes]);
          alert("Paciente registrado con éxito.");
        }

        setFormRegistro({
          nombre: '',
          dni: '',
          genero: 'Femenino',
          fechaNacimiento: '',
          telefono: '',
          contactoEmergencia: '',
          tipoSangre: 'No especificado',
          embarazada: 'No',
          enfermedadesBase: [],
          otrasAfecciones: '',
          alergias: '',
          severidadAlergia: 'Leve (Urticaria/Picazón)'
        });

        setEditandoPacienteId(null);
        setVistaActual('seguimiento');
      };

      const handleAperturarSeguimiento = () => {
        const seguimientoAbierto = pacienteSeleccionado.seguimientos.find(s => s.estado === 'abierto');
        if (seguimientoAbierto) {
          return alert(`El paciente ya cuenta con el Seguimiento N°${seguimientoAbierto.numero} abierto en curso.`);
        }

        const nuevoNumero = pacienteSeleccionado.seguimientos.length + 1;
        const nuevoSeguimiento = {
          id: Date.now().toString(),
          numero: nuevoNumero,
          fechaInicio: new Date().toLocaleString(),
          fechaFin: null,
          estado: 'abierto',
          mediciones: []
        };

        const pacientesActualizados = pacientes.map(p => {
          if (p.id === pacienteSeleccionado.id) {
            return {
              ...p,
              seguimientos: [nuevoSeguimiento, ...p.seguimientos]
            };
          }
          return p;
        });

        setPacientes(pacientesActualizados);
        setPacienteSeleccionado(prev => ({
          ...prev,
          seguimientos: [nuevoSeguimiento, ...prev.seguimientos]
        }));
      };

      const handleConcluirSeguimiento = (seguimientoId) => {
        if (!confirm("¿Deseas marcar este seguimiento como Paciente Estable / Alta?")) return;

        const fechaCierre = new Date().toLocaleString();

        const pacientesActualizados = pacientes.map(p => {
          if (p.id === pacienteSeleccionado.id) {
            const segs = p.seguimientos.map(s => {
              if (s.id === seguimientoId) {
                return { ...s, estado: 'concluido', fechaFin: fechaCierre };
              }
              return s;
            });
            return { ...p, seguimientos: segs };
          }
          return p;
        });

        setPacientes(pacientesActualizados);
        setPacienteSeleccionado(prev => ({
          ...prev,
          seguimientos: prev.seguimientos.map(s => {
            if (s.id === seguimientoId) {
              return { ...s, estado: 'concluido', fechaFin: fechaCierre };
            }
            return s;
          })
        }));
      };

      const handleAgregarMedicion = (e, seguimientoId) => {
        e.preventDefault();

        let valorTexto = '';

        if (nuevaMedicion.tipo === 'Control de Glucosa') {
          if (!nuevaMedicion.glucosa) return alert("Ingrese el valor de la glucosa.");
          valorTexto = `${nuevaMedicion.glucosa} mg/dL`;
        } else if (nuevaMedicion.tipo === 'Presión Arterial') {
          if (!nuevaMedicion.sistolica || !nuevaMedicion.diastolica) return alert("Ingrese ambos valores.");
          valorTexto = `${nuevaMedicion.sistolica}/${nuevaMedicion.diastolica} mmHg`;
        }

        const evaluacion = evaluarNivelClinico(nuevaMedicion.tipo, nuevaMedicion, nuevaMedicion.condicion);

        const registro = {
          id: Date.now().toString(),
          fecha: new Date().toLocaleString(),
          tipo: nuevaMedicion.tipo,
          valorTexto: valorTexto,
          condicion: nuevaMedicion.condicion,
          observacion: nuevaMedicion.observacion,
          evaluacion: evaluacion
        };

        const pacientesActualizados = pacientes.map(p => {
          if (p.id === pacienteSeleccionado.id) {
            const segs = p.seguimientos.map(s => {
              if (s.id === seguimientoId) {
                return { ...s, mediciones: [registro, ...s.mediciones] };
              }
              return s;
            });
            return { ...p, seguimientos: segs };
          }
          return p;
        });

        setPacientes(pacientesActualizados);
        setPacienteSeleccionado(prev => ({
          ...prev,
          seguimientos: prev.seguimientos.map(s => {
            if (s.id === seguimientoId) {
              return { ...s, mediciones: [registro, ...s.mediciones] };
            }
            return s;
          })
        }));

        setNuevaMedicion({
          tipo: nuevaMedicion.tipo,
          glucosa: '',
          sistolica: '',
          diastolica: '',
          condicion: nuevaMedicion.condicion,
          observacion: ''
        });
      };

      // AGREGAR INYECCIÓN ANTICONCEPTIVA CON CÁLCULO MENSUAL EXACTO
      const handleAgregarInyeccionAnticonceptiva = (e) => {
        e.preventDefault();
        if (!nuevaInyeccion.medicamento) return alert("Ingrese el nombre/marca del inyectable.");

        const hoy = new Date();
        const meses = nuevaInyeccion.tipo === 'Mensual' ? 1 : 3;
        const proxima = sumarMesesMismaFecha(hoy, meses);

        const registro = {
          id: Date.now().toString(),
          fechaAplicacion: new Date().toLocaleDateString(),
          medicamento: nuevaInyeccion.medicamento,
          tipo: nuevaInyeccion.tipo,
          proximaFecha: proxima,
          observacion: nuevaInyeccion.observacion
        };

        const pacientesActualizados = pacientes.map(p => {
          if (p.id === pacienteAnticonceptivoSel.id) {
            const listaAnt = p.inyeccionesAnticonceptivas || [];
            return { ...p, inyeccionesAnticonceptivas: [registro, ...listaAnt] };
          }
          return p;
        });

        setPacientes(pacientesActualizados);
        setPacienteAnticonceptivoSel(prev => ({
          ...prev,
          inyeccionesAnticonceptivas: [registro, ...(prev.inyeccionesAnticonceptivas || [])]
        }));

        setNuevaInyeccion({
          medicamento: '',
          tipo: 'Mensual',
          observacion: ''
        });
      };

      // CÁLCULO DÍAS RESTANTES PARA INYECCIÓN
      const calcularDiasRestantes = (strProximaFecha) => {
        const fechaProx = parseFecha(strProximaFecha);
        if (!fechaProx) return null;
        
        const hoy = new Date();
        hoy.setHours(0, 0, 0, 0);
        fechaProx.setHours(0, 0, 0, 0);

        const diffTiempo = fechaProx.getTime() - hoy.getTime();
        return Math.ceil(diffTiempo / (1000 * 3600 * 24));
      };

      const pacientesFiltrados = pacientes.filter(p => {
        const coincideBusqueda = p.nombre.toLowerCase().includes(busqueda.toLowerCase()) || p.dni.includes(busqueda);
        const tieneAbierto = p.seguimientos.some(s => s.estado === 'abierto');

        if (filtroEstado === 'todos') return coincideBusqueda;
        if (filtroEstado === 'activo') return coincideBusqueda && tieneAbierto;

                          required
                          placeholder="Ej: Cyclofem, Mesigyna, Depo-Provera"
                          class="w-full border p-2 rounded-lg bg-white"
                          value={nuevaInyeccion.medicamento}
                          onChange={e => setNuevaInyeccion({...nuevaInyeccion, medicamento: e.target.value})}
                        />
                      </div>

                      <div>
                        <label class="font-semibold block mb-1 text-slate-600">Frecuencia</label>
                        <select
                          class="w-full border p-2 rounded-lg bg-white font-medium"
                          value={nuevaInyeccion.tipo}
                          onChange={e => setNuevaInyeccion({...nuevaInyeccion, tipo: e.target.value})}
                        >
                          <option value="Mensual">Mensual (1 mes)</option>
                          <option value="Trimestral">Trimestral (3 meses)</option>
                        </select>
                      </div>

                      <button type="submit" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2.5 rounded-lg shadow transition">
                        + Registrar Inyección
                      </button>
                    </form>
                  </div>

                  <div>
                    <h3 class="font-bold text-sm text-purple-950 mb-3 border-b pb-2">📋 Historial de Aplicaciones</h3>
                    
                    {(!pacienteAnticonceptivoSel.inyeccionesAnticonceptivas || pacienteAnticonceptivoSel.inyeccionesAnticonceptivas.length === 0) ? (
                      <p class="text-xs text-slate-400 italic py-4">No hay aplicaciones registradas para esta paciente.</p>
                    ) : (
                      <table class="w-full text-left border-collapse text-xs">
                        <thead>
                          <tr class="bg-purple-100/60 border-b border-purple-200 text-purple-900">
                            <th class="p-2.5">Fecha Aplicación</th>
                            <th class="p-2.5">Inyectable / Marca</th>
                            <th class="p-2.5">Tipo</th>
                            <th class="p-2.5">📅 Próxima Aplicación</th>
                          </tr>
                        </thead>
                        <tbody>
                          {pacienteAnticonceptivoSel.inyeccionesAnticonceptivas.map(iny => (
                            <tr key={iny.id} class="border-b hover:bg-slate-50">
                              <td class="p-2.5 font-medium">{iny.fechaAplicacion}</td>
                              <td class="p-2.5 font-bold text-purple-900">{iny.medicamento}</td>
                              <td class="p-2.5">{iny.tipo}</td>
                              <td class="p-2.5 font-bold text-emerald-700 bg-emerald-50 rounded">📅 {iny.proximaFecha}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    )}
                  </div>

                </div>

                <div class="p-4 bg-slate-100 border-t border-slate-200 flex justify-end no-print">
                  <button onClick={() => setPacienteAnticonceptivoSel(null)} class="bg-slate-600 hover:bg-slate-700 text-white px-5 py-2 rounded-lg text-sm font-medium">Cerrar Ventana</button>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
